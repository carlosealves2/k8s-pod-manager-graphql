sonar.projectKey=k8s-pod-manager
sonar.projectName=K8s Pod Manager
sonar.projectVersion=1.0

# Source code
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,**/graph/model/**,**/graph/generated.go,**/*.pb.go

# Tests
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage
sonar.go.coverage.reportPaths=coverage.out

# Go specific
sonar.language=go
sonar.sourceEncoding=UTF-8
