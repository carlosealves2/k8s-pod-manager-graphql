apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-pod-manager
  namespace: default
  labels:
    app: k8s-pod-manager
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-pod-manager
  template:
    metadata:
      labels:
        app: k8s-pod-manager
        version: v1
    spec:
      serviceAccountName: k8s-pod-manager-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: k8s-pod-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: IN_CLUSTER
              value: "true"
            - name: LOG_LEVEL
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: k8s-pod-manager-secret
                  key: database-url
            - name: ENABLE_CORS
              value: "true"
            - name: ALLOWED_ORIGINS
              value: "*"
            - name: RATE_LIMIT
              value: "100"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL