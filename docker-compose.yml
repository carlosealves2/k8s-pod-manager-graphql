version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: k8s-pod-manager-db
    environment:
      POSTGRES_DB: k8s_pod_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - k8s-pod-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: k8s-pod-manager-api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/k8s_pod_manager?sslmode=disable
      IN_CLUSTER: "false"
      KUBECONFIG: /root/.kube/config
      LOG_LEVEL: debug
      ENABLE_CORS: "true"
      ALLOWED_ORIGINS: "*"
      RATE_LIMIT: 100
    ports:
      - "8080:8080"
    volumes:
      - ${HOME}/.kube/config:/root/.kube/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - k8s-pod-net
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: k8s-pod-manager-adminer
    restart: always
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - k8s-pod-net

volumes:
  postgres_data:
    driver: local

networks:
  k8s-pod-net:
    driver: bridge